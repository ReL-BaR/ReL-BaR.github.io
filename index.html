<h1>zumbido-backup</h1>
<p>A private, single-user tool that backs up the owner's own beekeeping notes from a home server
to the owner's own Google Drive, using <a href="https://rclone.org">rclone</a>.</p>
<p>It is not offered to anyone else. It only accesses files it created itself (Google Drive scope
<code>drive.file</code>).</p>
